<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Diário de Trades</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="config-banner"></div>

  <div class="auth-shell">
    <div class="card">
      <div class="tabbar">
        <button id="tab-login" class="active">Entrar</button>
        <button id="tab-signup">Criar conta</button>
      </div>

      <form id="auth-form">
        <div class="field" style="margin-bottom: 12px">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6" autocomplete="current-password" />
        </div>
        <div class="form-actions" style="justify-content: stretch; margin-top: 18px">
          <button type="submit" class="btn btn-primary" style="width: 100%" id="submit-btn">Entrar</button>
        </div>
        <p class="error-text" id="error-text" style="display: none"></p>
      </form>

      <div style="display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--text-muted); font-size: 12px">
        <div style="flex: 1; height: 1px; background: var(--grid)"></div>
        ou
        <div style="flex: 1; height: 1px; background: var(--grid)"></div>
      </div>

      <button type="button" class="btn" id="google-btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continuar com Google
      </button>
    </div>
  </div>

  <script type="module" src="js/login-page.js"></script>
</body>
</html>
